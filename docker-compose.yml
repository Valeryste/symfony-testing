services:
  database:
    container_name: database
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: symfony
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
    ports:
      - '4306:3306'
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - app-network
  php:
    container_name: php
    build:
      context: ./php
    ports:
      - '9001:9000'
    volumes:
      - ./symfony:/var/www/symfony-testing/symfony
      - ./laravel:/var/www/symfony-testing/laravel
    networks:
      - app-network
    depends_on:
      - database
    extra_hosts:
      - 'laravel.dev:172.19.0.4'
      - 'symfony.dev:172.19.0.4'
  nginx:
    container_name: nginx
    image: nginx:stable-alpine
    ports:
      - '8080:80'
    volumes:
      - ./symfony:/var/www/symfony-testing/symfony
      - ./laravel:/var/www/symfony-testing/laravel
      - ./nginx/default.conf:/etc/nginx/default.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - app-network
    depends_on:
      - php

networks:
  app-network:
    driver: bridge